# Aegis Secrets Configuration
# Copy this to ~/.config/aegis/secrets.yaml and fill in your real values.
# NEVER commit actual secrets — this file is an example only.
#
# Usage:
#   aegis run --secrets ~/.config/aegis/secrets.yaml claude -- --dangerously-skip-permissions

secrets:
  # Inject Authorization header for GitHub API requests
  - name: github-api
    match_host: "api.github.com"
    inject_header: "Authorization"
    inject_value: "Bearer ghp_xxxxxxxxxxxxxxxxxxxx"

  # Inject Authorization header for OpenAI API requests
  - name: openai
    match_host: "api.openai.com"
    inject_header: "Authorization"
    inject_value: "Bearer sk-xxxxxxxxxxxxxxxxxxxx"

  # Inject API key for internal services (with path prefix filter)
  - name: internal-api
    match_host: "*.internal.example.com"
    match_path_prefix: "/api/v2"
    inject_header: "X-API-Key"
    inject_value: "key-xxxxxxxxxxxxxxxxxxxx"

# Environment variables to strip from the agent process.
# The agent will never see these values — Aegis injects them via the proxy instead.
strip_env:
  - OPENAI_API_KEY
  - ANTHROPIC_API_KEY
  - GITHUB_TOKEN
  - AWS_SECRET_ACCESS_KEY
  - AWS_SESSION_TOKEN
