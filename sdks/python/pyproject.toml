[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sdk"
version = "0.1.0"
description = "Python SDK for Aegis — AI agent security guardrails"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24",
    "websockets>=11.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1"]
openai-agents = ["openai-agents>=0.1"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.setuptools.packages.find]
include = ["aegis*"]
