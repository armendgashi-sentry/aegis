http:
  methods:
    safe: [GET, HEAD, OPTIONS, TRACE]
    inspect: [POST, PUT, PATCH]
    block: [DELETE]

  payload:
    block_sql:
      - DROP
      - DELETE
      - TRUNCATE
      - "ALTER TABLE"
      - UPDATE
    allow_sql:
      - SELECT
      - UNION
      - SHOW
      - DESCRIBE
    block_commands:
      - "rm -rf"
      - "rm -r"
      - "dd if="
      - mkfs
      - shutdown
      - reboot

  max_request_body: 10485760  # 10MB

shell:
  block_patterns:
    - "rm -rf"
    - "rm -r"
    - rmdir
    - "dd if="
    - mkfs
    - shred
    - "> /dev/"
    - shutdown
    - reboot
  block_sql_in_cli: true

rate_limit:
  requests_per_second: 10
  burst: 50
  per_target: true
